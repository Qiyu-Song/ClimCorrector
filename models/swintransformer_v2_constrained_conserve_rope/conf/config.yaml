# Paths to datasets and normalizations
climcorr_path: '/n/home00/zeyuanhu/ClimCorrector/'
train_dataset_path: '/n/holyscratch01/kuang_lab/zeyuanhu/scratch/climcorr_preprocessing/v1_test1/'
val_dataset_path: '/n/holyscratch01/kuang_lab/zeyuanhu/scratch/climcorr_preprocessing/v1_test1/'
input_mean: '/n/home00/zeyuanhu/ClimCorrector/preprocessing/normalization/inputs/input_mean_v3_futuretend_40year_sub23.npy'
input_std: '/n/home00/zeyuanhu/ClimCorrector/preprocessing/normalization/inputs/input_std_v3_futuretend_40year_sub23.npy'
target_mean: '/n/home00/zeyuanhu/ClimCorrector/preprocessing/normalization/outputs/target_dc_mean_v2_iter2_40year_sub23.npy'
target_std: '/n/home00/zeyuanhu/ClimCorrector/preprocessing/normalization/outputs/target_dc_std_v2_iter2_40year_sub23.npy'
restart_path: ''
restart_full_ckpt: False
restart_full_ckpt_reset_lrscheduler: False
save_path: '/n/holylfs04/LABS/kuang_lab/Lab/kuanglfs/zeyuanhu/climcorr/saved_models/'
target_filename: 'target'

# dataloader configuration
variable_subsets: 'v1'
input_clip: False
target_clip: True
target_clip_value: 100
train_subsample_frac: 1.0  # fraction of train samples to use (random, seeded). 1.0 = all (previous behavior). <1.0 for data-amount / learning-curve experiments.

# --- training speed (defaults preserve previous behaviour exactly) ---
amp_bf16: False        # bf16 autocast around fwd+loss. Measured no change in loss trajectory.
compile_blocks: False  # torch.compile each horiz/vert block INSIDE the checkpoint boundary.
                       # amp_bf16+compile_blocks together = 2.90x per sample on the factorized model.
num_workers: 16

# training parameters
expname: 'lstm_v1_test'
loss: 'huber'
loss_area_weight: False  # if True, weight the loss by grid_info gw (FV cell area) over latitude
loss_spectral: False       # if True, add a spatial-gradient ("spectral") loss term to combat blurring / under-dispersion of extremes. False = exact previous behavior.
loss_spectral_weight: 0.1  # weight on the spectral term (only used if loss_spectral=True); keeps it a nudge, not a dominator
log_val_r2: False          # if True, compute + log zonal / per-level validation R2 to wandb each epoch (scalars) + image plots every r2_plot_freq epochs. False = previous behavior.
r2_plot_freq: 5            # when log_val_r2=True: log the full zonal/per-level R2 image plots every N epochs (per-variable R2 scalars are logged every epoch)
seed: 42                 # RNG seed; vary for seed-repeat / noise-floor runs
optimizer: 'adam'
batch_size: 1024
epochs: 1
learning_rate: 0.0001
weight_decay: 0.001  # only used if optimizer == "adamw"
clip_grad: False
clip_grad_norm: 6.0

# setup the scheduler with step, reducedonplateau, cosine, cosine_warmup
scheduler_name: 'cosine_warmup'
scheduler:
   step:
      step_size: 2
      gamma: 0.3162278
   plateau:
      patience: 2
      factor: 0.1
   cosine:
      T_max: 2
      eta_min: 0.00001
   cosine_warmup:
      T_0: 5
      T_mult: 1
      eta_min: 1.5e-6


# option of saving model checkpoints
save_top_ckpts: 5
top_ckpt_mode: 'min'

# option of early stopping
early_stop_step: -1

# logging
mini_batch_log_freq: 100
logger: 'wandb'
wandb:
   project: "v5_unet"

# architecture configuration
lstm:
  seq_len: 26                # Sequence length
  hidden_size: 256           # Size of hidden layers
  output_size: 4             # Output size
  num_layers: 6              # Number of LSTM layers
  hidden_layers: [256, 512]  # List of hidden layer sizes (optional in LSTM)
  dropout: 0.1               # Dropout rate
  bidirectional: true        # Whether to use bidirectional LSTM

mlp:
   hidden_dims: 256
   layers: 7

unet:
   model_channels: 128
   num_blocks: 2
   attn_resolutions: [0]
   dropout: 0.0

swin:
   window_size_x: 4
   window_size_y: 8
   in_chans: 200
   out_chans: 104
   embed_dim: 768
   depths: 12
   num_heads: 8
   mlp_ratio: 4.0
   init_values: 0.0
   drop_rate: 0.0
   pos_encoding: 'rope_mixed'
   rope_theta: 10.0
   checkpoint_stages: False
   pole_padding: True
   pole_padding_value: 6
   pole_tqmean: True
   conserve_water: True
   conserve_heat: True
